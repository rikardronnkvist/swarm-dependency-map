<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swarm dependency map</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <p id="error" role="alert" hidden></p>
    <div id="graph" aria-label="Service dependency graph"></div>
    <aside id="node-info" aria-labelledby="node-info-title" hidden>
      <button id="close-info" type="button" aria-label="Close information">Close</button>
      <button id="hide-node" type="button">Hide</button>
      <h2 id="node-info-title" class="info-color selected"></h2>
      <div id="node-info-content"></div>
    </aside>
    <section class="graph-controls" aria-label="Diagram filters">
      <label class="graph-option"><input id="show-non-dependant" type="checkbox"> Show non-dependant</label>
      <label class="graph-option"><input id="show-swarm-nodes" type="checkbox"> Show Swarm nodes</label>
      <div class="graph-filter">
        <label for="swarm-node">Swarm node</label>
        <select id="swarm-node" disabled><option value="">All nodes</option></select>
      </div>
      <div class="graph-filter">
        <label for="category">Category</label>
        <select id="category"><option value="">All categories</option></select>
      </div>
      <div class="graph-filter">
        <label for="search">Filter</label>
        <input id="search" type="search" placeholder="Search services">
      </div>
      <label class="graph-option"><input id="show-networks" type="checkbox"> Show networks</label>
    </section>
  </main>
</body>
</html>
