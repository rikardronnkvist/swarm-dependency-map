<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swarm dependency map</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <h1>Swarm dependency map</h1>
    <button id="refresh" type="button">Refresh</button>
  </header>
  <main>
    <p id="error" role="alert" hidden></p>
    <div id="graph" aria-label="Service dependency graph"></div>
    <label class="graph-option"><input id="show-non-dependant" type="checkbox"> Show non-dependant</label>
    <div class="graph-filter">
      <label for="search">Filter by service, category, or dependency</label>
      <input id="search" type="search" placeholder="Search services">
    </div>
    <div class="graph-filter">
      <label for="category">Category</label>
      <select id="category"><option value="">All categories</option></select>
    </div>
  </main>
</body>
</html>
